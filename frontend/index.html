<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voltyx — Inventario y Compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="container-fluid app-shell">
  <div class="row flex-nowrap">
    <aside class="col-12 col-lg-2 sidebar d-flex flex-column">
      <div class="brand d-flex align-items-center gap-3">
        <div class="brand-mark d-flex align-items-center justify-content-center">V</div>
        <div class="brand-text">
          <strong>VOLTYX</strong>
          <span>inventario &amp; compras</span>
        </div>
      </div>
      <nav class="nav flex-column" id="nav">
        <button class="nav-item active d-flex align-items-center gap-2" data-view="dashboard">
          <span class="nav-dot"></span> Dashboard
        </button>
        <button class="nav-item d-flex align-items-center gap-2" data-view="productos">
          <span class="nav-dot"></span> Productos
        </button>
        <button class="nav-item d-flex align-items-center gap-2" data-view="categorias">
          <span class="nav-dot"></span> Categorias
        </button>
        <button class="nav-item d-flex align-items-center gap-2" data-view="proveedores">
          <span class="nav-dot"></span> Proveedores
        </button>
        <button class="nav-item d-flex align-items-center gap-2" data-view="compras">
          <span class="nav-dot"></span> Compras
        </button>
        <button class="nav-item d-flex align-items-center gap-2" data-view="movimientos">
          <span class="nav-dot"></span> Movimientos
        </button>
      </nav>
      <div class="hazard-strip" aria-hidden="true"></div>
      <div class="sidebar-footer mt-auto">API: <span id="api-status" class="badge status-off">verificando…</span></div>
    </aside>

    <main class="col-12 col-lg-10 content">
      <footer class="text-center dim small py-3">Voltyx — Proyecto de Desarrollo Web 2026</footer>
      <header class="topbar d-flex flex-wrap align-items-center justify-content-between gap-3">
        <h1 id="view-title" class="mb-0">Dashboard</h1>
        <div class="topbar-search" id="global-search-wrap">
          <input type="text" class="form-control" id="global-search" placeholder="Buscar producto por nombre o código…" />
        </div>
      </header>

      <section id="view-root" class="view-root">
      </section>
    </main>
  </div>
</div>


<div class="modal fade" id="app-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" id="app-modal-content">
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
