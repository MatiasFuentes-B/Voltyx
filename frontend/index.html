<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VOLTYX — Inventario y Compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">B</div>
      <div class="brand-text">
        <strong>VOLTYX</strong>
        <span>inventario &amp; compras</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="dashboard">
        <span class="nav-dot"></span> Dashboard
      </button>
      <button class="nav-item" data-view="productos">
        <span class="nav-dot"></span> Productos
      </button>
      <button class="nav-item" data-view="categorias">
        <span class="nav-dot"></span> Categorias
      </button>
      <button class="nav-item" data-view="proveedores">
        <span class="nav-dot"></span> Proveedores
      </button>
      <button class="nav-item" data-view="compras">
        <span class="nav-dot"></span> Compras
      </button>
      <button class="nav-item" data-view="movimientos">
        <span class="nav-dot"></span> Movimientos
      </button>
    </nav>
    <div class="hazard-strip" aria-hidden="true"></div>
    <div class="sidebar-footer">API: <span id="api-status" class="status-pill status-off">verificando…</span></div>
  </aside>

  <main class="content">
    <header class="topbar">
      <h1 id="view-title">Dashboard</h1>
      <div class="topbar-search" id="global-search-wrap">
        <input type="text" id="global-search" placeholder="Buscar producto por nombre o código…" />
      </div>
    </header>

    <section id="view-root" class="view-root">
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
